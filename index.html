<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jolly PDF 智能上色系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --primary: #4F46E5;
      --secondary: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --bg: #F8FAFC;
      --white: #FFFFFF;
      --text: #1E293B;
      --text-light: #64748B;
      --border: #E2E8F0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    
    .header {
      background: linear-gradient(135deg, var(--primary), #7C3AED);
      color: white;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    
    .logo h1 { font-size: 20px; font-weight: 700; }
    .logo span { font-size: 13px; opacity: 0.9; }
    
    .stats-bar { display: flex; gap: 32px; }
    .stat { text-align: center; }
    .stat-value { font-size: 28px; font-weight: 700; }
    .stat-label { font-size: 12px; opacity: 0.8; }
    
    .container { max-width: 1600px; margin: 0 auto; padding: 24px; }
    
    .upload-section {
      background: var(--white);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    
    .upload-section h2 {
      font-size: 24px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .upload-section p { color: var(--text-light); font-size: 15px; margin-bottom: 24px; }
    
    .upload-area {
      border: 3px dashed var(--border);
      border-radius: 16px;
      padding: 60px 40px;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
      background: linear-gradient(135deg, #F8FAFC, #F1F5F9);
    }
    
    .upload-area:hover {
      border-color: var(--primary);
      background: linear-gradient(135deg, #EEF2FF, #E0E7FF);
      transform: translateY(-2px);
    }
    
    .upload-area.dragover {
      border-color: var(--primary);
      background: #EEF2FF;
      transform: scale(1.02);
    }
    
    .upload-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    .upload-area h3 { font-size: 20px; margin-bottom: 8px; }
    .upload-area p { color: var(--text-light); margin: 0; }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    
    .btn-primary:hover {
      background: #4338CA;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }
    
    .btn-secondary {
      background: var(--secondary);
      color: white;
    }
    
    .btn-secondary:hover {
      background: #059669;
      transform: translateY(-2px);
    }
    
    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
    }
    
    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .viewer-section {
      background: var(--white);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: none;
    }
    
    .viewer-section.active { display: block; }
    
    .viewer-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .toolbar-right {
      display: flex;
      gap: 12px;
    }
    
    .file-name {
      font-weight: 600;
      font-size: 16px;
    }
    
    .page-indicator {
      background: var(--bg);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
    }
    
    .viewer-main {
      display: flex;
      gap: 24px;
    }
    
    .page-thumbnails {
      width: 120px;
      flex-shrink: 0;
    }
    
    .thumbnail-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 600px;
      overflow-y: auto;
    }
    
    .thumbnail {
      position: relative;
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .thumbnail:hover { border-color: var(--primary); }
    .thumbnail.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
    
    .thumbnail img {
      width: 100%;
      display: block;
    }
    
    .thumbnail-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 11px;
      text-align: center;
      padding: 4px;
    }
    
    .thumbnail-status {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    
    .thumbnail-status.colored { background: var(--secondary); color: white; }
    .thumbnail-status.approved { background: var(--primary); color: white; }
    .thumbnail-status.pending { background: var(--warning); color: white; }
    
    .compare-view {
      flex: 1;
      display: flex;
      gap: 16px;
    }
    
    .view-panel {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    
    .panel-header {
      background: var(--bg);
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .scroll-container {
      height: 600px;
      overflow: auto;
      position: relative;
    }
    
    .scroll-container canvas {
      display: block;
      width: 100%;
    }
    
    .nav-buttons {
      display: flex;
      gap: 8px;
    }
    
    .nav-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .nav-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .loading-modal {
      background: white;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      min-width: 400px;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .loading-subtitle {
      color: var(--text-light);
      margin-bottom: 20px;
    }
    
    .progress-bar {
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s;
    }
    
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 16px 24px;
      border-radius: 12px;
      color: white;
      font-weight: 500;
      z-index: 1001;
      animation: slideIn 0.3s ease;
    }
    
    .toast.success { background: var(--secondary); }
    .toast.error { background: var(--danger); }
    .toast.info { background: var(--primary); }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    .empty-state {
      padding: 60px;
      text-align: center;
      color: var(--text-light);
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .color-picker-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .color-picker-container input[type="color"] {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .page-input-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-input {
      width: 60px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .page-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🎨</div>
      <div>
        <h1>Jolly PDF 智能上色系統</h1>
        <span>使用 MiniMax AI 為黑白教材上色</span>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">總頁數</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-colored">0</div>
        <div class="stat-label">已上色</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-approved">0</div>
        <div class="stat-label">已確認</div>
      </div>
    </div>
  </header>
  
  <main class="container">
    <section class="upload-section" id="upload-section">
      <h2>📤 上傳 PDF 檔案</h2>
      <p>支援 Jolly 系列中文教材 PDF，系統會自動為每頁上色</p>
      
      <div class="upload-area" id="upload-area">
        <div class="upload-icon">📄</div>
        <h3>點擊或拖曳 PDF 檔案到此處</h3>
        <p>或點擊選擇檔案</p>
        <input type="file" id="file-input" accept=".pdf" style="display:none">
      </div>
    </section>
    
    <section class="viewer-section" id="viewer-section">
      <div class="viewer-toolbar">
        <div class="toolbar-left">
          <span class="file-name" id="file-name">document.pdf</span>
          <div class="page-indicator">
            <span id="current-page-display">1</span> / <span id="total-pages-display">1</span>
          </div>
          <div class="page-input-container">
            <input type="number" class="page-input" id="page-input" min="1" value="1">
            <button class="btn btn-outline" onclick="goToPageFromInput()">跳轉</button>
          </div>
          <div class="nav-buttons">
            <button class="nav-btn" id="prev-page" title="上一頁">◀</button>
            <button class="nav-btn" id="next-page" title="下一頁">▶</button>
          </div>
        </div>
        <div class="toolbar-right">
          <button class="btn btn-primary" id="batch-colorize">
            ✨ AI 上色
          </button>
          <button class="btn btn-secondary" id="approve-page">
            ✓ 確認
          </button>
          <button class="btn btn-secondary" id="download-pdf">
            📥 下載彩色 PDF
          </button>
        </div>
      </div>
      
      <div class="viewer-main">
        <div class="page-thumbnails">
          <div class="thumbnail-list" id="thumbnail-list"></div>
        </div>
        
        <div class="compare-view">
          <div class="view-panel">
            <div class="panel-header">
              <span>📄 原始版本</span>
              <span id="original-page-label">第 1 頁</span>
            </div>
            <div class="scroll-container" id="original-scroll">
              <canvas id="original-canvas"></canvas>
            </div>
          </div>
          
          <div class="view-panel">
            <div class="panel-header">
              <span>🎨 上色版本</span>
              <div class="color-picker-container">
                <input type="color" id="bg-color-picker" value="#ffffff" title="背景顏色">
              </div>
            </div>
            <div class="scroll-container" id="colored-scroll">
              <canvas id="colored-canvas"></canvas>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-modal">
      <div class="loading-spinner"></div>
      <div class="loading-title" id="loading-title">AI 上色中...</div>
      <div class="loading-subtitle" id="loading-subtitle">第 1 / 8 頁</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let pageImages = [];
    let coloredImages = [];
    let pageStates = [];
    let pageCanvases = [];
    
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file-input');
    const uploadSection = document.getElementById('upload-section');
    const viewerSection = document.getElementById('viewer-section');
    const originalCanvas = document.getElementById('original-canvas');
    const coloredCanvas = document.getElementById('colored-canvas');
    
    // Event listeners
    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', handleFileSelect);
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type === 'application/pdf') {
        handlePDF(files[0]);
      }
    });
    
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) handlePDF(file);
    }
    
    async function handlePDF(file) {
      showLoading('載入 PDF 中...', '');
      
      const arrayBuffer = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      totalPages = pdfDoc.numPages;
      
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('total-pages-display').textContent = totalPages;
      
      pageImages = [];
      coloredImages = [];
      pageStates = new Array(totalPages).fill('pending');
      pageCanvases = [];
      
      for (let i = 1; i <= totalPages; i++) {
        const canvas = document.createElement('canvas');
        const scale = 2;
        const viewport = (await pdfDoc.getPage(i)).getViewport({ scale });
        
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        const context = canvas.getContext('2d');
        await (await pdfDoc.getPage(i)).render({
          canvasContext: context,
          viewport: viewport
        }).promise;
        
        pageImages.push(canvas.toDataURL('image/png'));
        pageCanvases.push(canvas);
        coloredImages.push(null);
      }
      
      renderThumbnails();
      renderPage(1);
      
      uploadSection.classList.add('hidden');
      viewerSection.classList.add('active');
      updateStats();
      hideLoading();
    }
    
    function renderThumbnails() {
      const list = document.getElementById('thumbnail-list');
      list.innerHTML = '';
      
      for (let i = 1; i <= totalPages; i++) {
        const thumb = document.createElement('div');
        thumb.className = 'thumbnail' + (i === currentPage ? ' active' : '');
        thumb.onclick = () => renderPage(i);
        
        const img = document.createElement('img');
        img.src = pageImages[i - 1];
        thumb.appendChild(img);
        
        const label = document.createElement('div');
        label.className = 'thumbnail-label';
        label.textContent = `第 ${i} 頁`;
        thumb.appendChild(label);
        
        const status = document.createElement('div');
        status.className = 'thumbnail-status ' + pageStates[i - 1];
        status.textContent = pageStates[i - 1] === 'colored' ? '✓' : 
                            pageStates[i - 1] === 'approved' ? '★' : '○';
        thumb.appendChild(status);
        
        list.appendChild(thumb);
      }
    }
    
    function renderPage(pageNum) {
      currentPage = pageNum;
      
      document.getElementById('current-page-display').textContent = pageNum;
      document.getElementById('page-input').value = pageNum;
      document.getElementById('original-page-label').textContent = `第 ${pageNum} 頁`;
      
      // Render original
      const origCtx = originalCanvas.getContext('2d');
      origCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
      
      const origImg = new Image();
      origImg.src = pageImages[pageNum - 1];
      origImg.onload = () => {
        originalCanvas.width = origImg.width;
        originalCanvas.height = origImg.height;
        origCtx.drawImage(origImg, 0, 0);
      };
      
      // Render colored
      coloredCanvas.width = originalCanvas.width;
      coloredCanvas.height = originalCanvas.height;
      const colorCtx = coloredCanvas.getContext('2d');
      colorCtx.fillStyle = document.getElementById('bg-color-picker').value;
      colorCtx.fillRect(0, 0, coloredCanvas.width, coloredCanvas.height);
      
      if (coloredImages[pageNum - 1]) {
        const colorImg = new Image();
        colorImg.src = coloredImages[pageNum - 1];
        colorImg.onload = () => {
          colorCtx.drawImage(colorImg, 0, 0, coloredCanvas.width, coloredCanvas.height);
        };
      }
      
      // Update thumbnails
      document.querySelectorAll('.thumbnail').forEach((t, i) => {
        t.classList.toggle('active', i + 1 === pageNum);
      });
      
      // Update nav buttons
      document.getElementById('prev-page').disabled = pageNum <= 1;
      document.getElementById('next-page').disabled = pageNum >= totalPages;
    }
    
    function goToPageFromInput() {
      const pageNum = parseInt(document.getElementById('page-input').value);
      if (pageNum >= 1 && pageNum <= totalPages) {
        renderPage(pageNum);
      }
    }
    
    // Image hosting services to try
    const HOSTING_SERVICES = [
      {
        name: 'litterbox',
        upload: async (base64) => {
          const cleanBase64 = base64.includes(',') ? base64.split(',')[1] : base64;
          const binary = atob(cleanBase64);
          const array = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            array[i] = binary.charCodeAt(i);
          }
          
          const formData = new FormData();
          formData.append('reqtype', 'fileurl');
          formData.append('time', '72h'); // Keep for 72 hours
          formData.append('fileToUpload', new Blob([array]), 'image.png');
          
          const response = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
            method: 'POST',
            body: formData
          });
          
          const text = await response.text();
          if (text.startsWith('https://')) {
            return text;
          }
          throw new Error('litterbox failed: ' + text);
        }
      },
      {
        name: 'tempimg',
        upload: async (base64) => {
          const cleanBase64 = base64.includes(',') ? base64.split(',')[1] : base64;
          const binary = atob(cleanBase64);
          const array = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            array[i] = binary.charCodeAt(i);
          }
          
          const formData = new FormData();
          formData.append('image', new Blob([array]), 'image.png');
          
          const response = await fetch('https://tempimg.net/api/upload', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          if (result.url) {
            return result.url;
          }
          throw new Error('tempimg failed');
        }
      },
      {
        name: 'imgbb',
        upload: async (base64) => {
          const cleanBase64 = base64.includes(',') ? base64.split(',')[1] : base64;
          
          const response = await fetch('https://api.imgbb.com/1/upload?key=5ac872b888c2b68e6cd901a53b642365', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
              image: cleanBase64,
              expiration: '604800'
            }).toString()
          });
          
          const result = await response.json();
          if (result.success && result.data && result.data.url) {
            return result.data.url;
          }
          throw new Error('imgbb failed');
        }
      }
    ];
    
    async function uploadImage(base64) {
      const errors = [];
      
      for (const service of HOSTING_SERVICES) {
        try {
          console.log('Trying:', service.name);
          const url = await service.upload(base64);
          console.log('Success with:', service.name, url);
          return url;
        } catch (e) {
          console.log('Failed:', service.name, e.message);
          errors.push(`${service.name}: ${e.message}`);
        }
      }
      
      throw new Error('所有圖床都失敗: ' + errors.join('; '));
    }
    
    async function colorizePage(pageNum) {
      const imageBase64 = pageImages[pageNum - 1];
      
      // Upload to image hosting
      let imageUrl;
      try {
        imageUrl = await uploadImage(imageBase64);
      } catch (e) {
        throw new Error('圖片上傳失敗: ' + e.message);
      }
      
      const response = await fetch('/api/colorize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image_url: imageUrl,
          page: pageNum.toString()
        })
      });
      
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'API 調用失敗');
      }
      
      const result = await response.json();
      
      if (result.success && result.imageUrl) {
        coloredImages[pageNum - 1] = result.imageUrl;
        pageStates[pageNum - 1] = 'colored';
        
        if (currentPage === pageNum) {
          coloredCanvas.width = pageCanvases[pageNum - 1].width;
          coloredCanvas.height = pageCanvases[pageNum - 1].height;
          const ctx = coloredCanvas.getContext('2d');
          const img = new Image();
          img.src = result.imageUrl;
          await new Promise(resolve => img.onload = () => {
            ctx.drawImage(img, 0, 0, coloredCanvas.width, coloredCanvas.height);
          });
        }
      } else {
        throw new Error(result.error || '上色失敗');
      }
    }
    
    async function colorizeAllPages() {
      showLoading('AI 上色中...', `第 1 / ${totalPages} 頁`);
      
      for (let i = 1; i <= totalPages; i++) {
        if (pageStates[i - 1] !== 'approved') {
          try {
            await colorizePage(i);
          } catch (e) {
            showToast(`第 ${i} 頁上色失敗: ${e.message}`, 'error');
          }
        }
        
        document.getElementById('loading-subtitle').textContent = `第 ${i} / ${totalPages} 頁`;
        document.getElementById('progress-fill').style.width = `${(i / totalPages) * 100}%`;
        
        renderThumbnails();
        updateStats();
      }
      
      hideLoading();
      showToast('所有頁面已上色完成！', 'success');
      
      if (currentPage) renderPage(currentPage);
    }
    
    function setupPageNav() {
      document.getElementById('prev-page').addEventListener('click', () => {
        if (currentPage > 1) renderPage(currentPage - 1);
      });
      
      document.getElementById('next-page').addEventListener('click', () => {
        if (currentPage < totalPages) renderPage(currentPage + 1);
      });
    }
    
    function goToPage(num) {
      renderPage(num);
    }
    
    function setupActions() {
      document.getElementById('batch-colorize').addEventListener('click', colorizeAllPages);
      
      document.getElementById('approve-page').addEventListener('click', () => {
        pageStates[currentPage - 1] = 'approved';
        renderPage(currentPage);
        updateStats();
        showToast('已確認本頁', 'success');
        
        if (currentPage < totalPages) {
          setTimeout(() => renderPage(currentPage + 1), 300);
        }
      });
      
      document.getElementById('download-pdf').addEventListener('click', downloadPDF);
    }
    
    function updateStats() {
      document.getElementById('stat-total').textContent = totalPages;
      document.getElementById('stat-colored').textContent = pageStates.filter(s => s === 'colored' || s === 'approved').length;
      document.getElementById('stat-approved').textContent = pageStates.filter(s => s === 'approved').length;
    }
    
    function setupSyncScroll() {
      const originalScroll = document.getElementById('original-scroll');
      const coloredScroll = document.getElementById('colored-scroll');
      
      let syncing = false;
      
      originalScroll.addEventListener('scroll', () => {
        if (syncing) return;
        syncing = true;
        coloredScroll.scrollTop = originalScroll.scrollTop;
        coloredScroll.scrollLeft = originalScroll.scrollLeft;
        requestAnimationFrame(() => syncing = false);
      });
      
      coloredScroll.addEventListener('scroll', () => {
        if (syncing) return;
        syncing = true;
        originalScroll.scrollTop = coloredScroll.scrollTop;
        originalScroll.scrollLeft = coloredScroll.scrollLeft;
        requestAnimationFrame(() => syncing = false);
      });
      
      document.getElementById('bg-color-picker').addEventListener('input', (e) => {
        if (currentPage) renderPage(currentPage);
      });
    }
    
    async function downloadPDF() {
      showLoading('生成 PDF 中...', '');
      
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      
      for (let i = 0; i < totalPages; i++) {
        const imgSrc = coloredImages[i] || pageImages[i];
        const img = new Image();
        img.src = imgSrc;
        await new Promise(resolve => img.onload = resolve);
        
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imgData = canvas.toDataURL('image/jpeg', 0.9);
        
        if (i > 0) pdf.addPage();
        
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();
        const ratio = Math.min(pdfWidth / img.width, pdfHeight / img.height);
        const imgWidth = img.width * ratio;
        const imgHeight = img.height * ratio;
        const x = (pdfWidth - imgWidth) / 2;
        const y = (pdfHeight - imgHeight) / 2;
        
        pdf.addImage(imgData, 'JPEG', x, y, imgWidth, imgHeight);
        
        document.getElementById('loading-subtitle').textContent = `處理第 ${i + 1} / ${totalPages} 頁`;
      }
      
      pdf.save('colored_document.pdf');
      hideLoading();
      showToast('PDF 下載完成！', 'success');
    }
    
    function showLoading(title, subtitle) {
      document.getElementById('loading-title').textContent = title;
      document.getElementById('loading-subtitle').textContent = subtitle;
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('loading-overlay').classList.remove('hidden');
    }
    
    function hideLoading() {
      document.getElementById('loading-overlay').classList.add('hidden');
    }
    
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => toast.remove(), 5000);
    }
    
    // Load jsPDF for download
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    document.head.appendChild(script);
    
    // Initialize
    setupPageNav();
    setupActions();
    setupSyncScroll();
  </script>
</body>
</html>
